<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Love Surprise</title>
    <!-- Google Fonts for Burmese Typography & Handwritten Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Padauk:wght@400;700&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Padauk', sans-serif;
        }

        /* Vibrant Colorful Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #ff758c, #ff7eb3, #fa709a, #fee140, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-container {
            width: 100%;
            max-width: 440px;
            min-height: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Translucent Glassmorphism Card Style */
        .interactive-card {
            background: rgba(255, 255, 255, 0.75);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.6);
            text-align: center;
            width: 100%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: all 0.4s ease;
        }

        .step {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .step.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        img.gif-box {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.9);
        }

        h2 {
            color: #be123c;
            font-size: 1.3rem;
            line-height: 1.6;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            min-height: 110px;
            position: relative;
            padding: 10px;
        }

        button {
            padding: 18px 40px;
            min-height: 60px;
            font-size: 1.25rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease, background 0.25s ease;
            letter-spacing: 1px;
            user-select: none;
            touch-action: manipulation;
            min-width: 130px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.5);
        }

        .btn-yes:hover {
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 12px 30px rgba(255, 65, 108, 0.7);
        }

        .btn-yes:active {
            transform: translateY(1px) scale(0.98);
        }

        .btn-no {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            box-shadow: 0 8px 25px rgba(106, 17, 203, 0.45);
        }

        .btn-no:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(106, 17, 203, 0.65);
        }

        /* Popup Container Wrapper */
        .btn-no-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        /* Popup Warning Window Above Button */
        .popup-warning {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 228, 230, 0.95);
            color: #e11d48;
            border: 2px solid #f43f5e;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 6px 18px rgba(225, 29, 72, 0.25);
            z-index: 10000;
            pointer-events: none;
            backdrop-filter: blur(4px);
            animation: popupBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .popup-warning::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #f43f5e transparent transparent transparent;
        }

        @keyframes popupBounce {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        /* Step 2 Full Screen Running No Button */
        #btn-no-2-wrapper {
            position: relative;
            transition: top 0.2s ease-out, left 0.2s ease-out;
            z-index: 9999;
        }

        #btn-no-2-wrapper.escaped {
            position: fixed !important;
            margin: 0 !important;
        }

        /* Falling Swaying GIF Container (Between Step 3 & Step 4) */
        .falling-envelope-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            animation: fallAndSway 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards, floatGentle 2.6s ease-in-out infinite 3.2s;
        }

        @keyframes fallAndSway {
            0% {
                transform: translateY(-280px) rotate(-18deg);
                opacity: 0;
            }
            30% {
                transform: translateY(-120px) rotate(14deg);
                opacity: 1;
            }
            60% {
                transform: translateY(20px) rotate(-10deg);
            }
            85% {
                transform: translateY(-8px) rotate(6deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes floatGentle {
            0%, 100% {
                transform: translateY(0px) rotate(-4deg);
            }
            50% {
                transform: translateY(-14px) rotate(4deg);
            }
        }

        /* Frame-less Transparent GIF */
        .no-frame-gif {
            width: 210px;
            height: auto;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.22));
            transition: transform 0.3s ease;
        }

        .falling-envelope-container:hover .no-frame-gif {
            transform: scale(1.08);
        }

        .tap-hint-badge {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.88);
            color: #be123c;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(6px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            animation: pulseHint 1.6s infinite ease-in-out;
        }

        @keyframes pulseHint {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        /* Step 4 Paper Letter Pop-in Animation */
        .paper-letter-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .paper-letter-pop {
            animation: popInLetter 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popInLetter {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-12deg);
            }
            70% {
                transform: scale(1.04) rotate(-2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(-2deg);
            }
        }

        .paper-sheet {
            position: relative;
            background-color: rgba(255, 253, 248, 0.96);
            backdrop-filter: blur(10px);
            background-image: 
                radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0),
                linear-gradient(to right, rgba(0,0,0,0.01) 1px, transparent 1px);
            background-size: 12px 12px, 100% 100%;
            width: 100%;
            padding: 32px 22px 28px 22px;
            border-radius: 16px;
            box-shadow: 
                -8px 15px 35px rgba(0, 0, 0, 0.2),
                0 4px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .paperclip {
            position: absolute;
            top: 12px;
            right: 28px;
            width: 18px;
            height: 45px;
            border: 3px solid #4a4a4a;
            border-radius: 12px;
            z-index: 6;
            transform: rotate(8deg);
            box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.25);
            background: transparent;
        }

        .paperclip::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 2px;
            width: 8px;
            height: 28px;
            border: 2px solid #5a5a5a;
            border-radius: 8px;
        }

        .letter-content {
            font-family: 'Pyidaungsu', sans-serif;
            color: #2b2b2b;
            line-height: 1.8;
            font-size: 0.95rem;
            text-align: left;
        }

        .letter-title {
            text-align: center;
            font-size: 1.3rem;
            color: #b91c1c;
            font-weight: 700;
            margin-bottom: 14px;
            border-bottom: 2px dashed #fca5a5;
            padding-bottom: 8px;
        }

        .letter-signature {
            text-align: right;
            margin-top: 18px;
            font-weight: 700;
            color: #9f1239;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- STEP 1 -->
        <div class="interactive-card step active" id="step-1">
            <img class="gif-box" src="https://media.tenor.com/2Jl1X7xa6UYAAAAi/bubu-dudu-eyes.gif" alt="Cute Gif 1">
            <h2><b>12 လပိုင်းကျပြန်လာရမလား</b></h2>
            <div class="btn-group">
                <button class="btn-yes" onclick="nextStep(2)">ပြန်မလာနဲ့</button>
                <div class="btn-no-wrapper" id="btn-no-1-wrapper">
                    <button class="btn-no" id="btn-no-1" onclick="handleNo1()">ပြန်လာခဲ့</button>
                </div>
            </div>
        </div>

        <!-- STEP 2 -->
        <div class="interactive-card step" id="step-2">
            <img class="gif-box" src="https://media.tenor.com/D6HDHJLAqb4AAAAi/dudu-bubu-dudu.gif" alt="Cute Gif 2">
            <h2><b>တကယ် ပြန်မလာရဘူးလား… 🥺</b></h2>
            <div class="btn-group" id="btn-container-2">
                <button class="btn-yes" onclick="nextStep(3)">မလာခဲ့နဲ့</button>
                <div class="btn-no-wrapper" id="btn-no-2-wrapper" onmouseover="moveNoButton(event)" onclick="moveNoButton(event)" ontouchstart="moveNoButton(event)">
                    <button class="btn-no" id="btn-no-2">လာခဲ့</button>
                </div>
            </div>
        </div>

        <!-- STEP 3 -->
        <div class="interactive-card step" id="step-3">
            <img class="gif-box" src="https://media.tenor.com/Lgr_6-nkvnUAAAAi/casal-dudu.gif" alt="Cute Gif 3">
            <h2><b>Cora ကိုချစ်လား</b></h2>
            <div class="btn-group">
                <button class="btn-yes" id="btn-yes-3" onclick="nextStep('falling')">မချစ်ဘူး</button>
                <div class="btn-no-wrapper" id="btn-no-3-wrapper">
                    <button class="btn-no" id="btn-no-3" onclick="handleNo3()">ချစ်တယ်</button>
                </div>
            </div>
        </div>

        <!-- STEP 3.5: FALLING GIF STEP -->
        <div class="step" id="step-falling" style="width: 100%;">
            <div class="falling-envelope-container" onclick="openLetter()">
                <!-- Frame-less Transparent Envelope GIF -->
                <img class="no-frame-gif" src="https://i.ibb.co/JWycnnh9/pngegg.png" alt="Falling Envelope GIF">
                <div class="tap-hint-badge">✉️ ePostcard For You ✨</div>
            </div>
        </div>

        <!-- STEP 4 (Love Letter Paper Card) -->
        <div class="step" id="step-4" style="width: 100%;">
            <div class="paper-letter-wrapper paper-letter-pop">
                <div class="paper-sheet">
                    <div class="paperclip"></div>

                    <div class="letter-content">
                        <div class="letter-title">💌 ချစ်ရပါသော… 💌</div>
                        <p>12 လပိုင်းပြန်လာခဲ့မယ်နော</p>
                        <br>
                        <p>အများကြီးလည်းချစ်တယ် တစ်သက်လုံးခင်သွားကြမယ် </p>
                        <br>
                        <p>ချစ်တယ် မမ Zuri ရေ အာဘွားးးး</p>
                        
                        <div class="letter-signature">
                            love you so much❤️
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const warnings = [
            "⚠️ No နှိပ်လို့ မရပါဘူးနော်!",
            "⚠️ Yes ပဲ နှိပ်ပါ! 🥺",
            "⚠️ No ကို နှိပ်ခွင့် မရှိပါဘူး! 💖",
            "⚠️ တကယ်ကြီး No နှိပ်မှာလား? 😭"
        ];

        function getRandomWarning() {
            return warnings[Math.floor(Math.random() * warnings.length)];
        }

        // Formspree သို့ Data ပို့ပေးမည့် API Function
        function sendToFormspree(userResponse, stepName) {
            fetch("https://formspree.io/f/xwlvwong", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    Step: stepName,

                    Answer: userResponse,
                    Timestamp: new Date().toLocaleString()
                })
            }).catch(error => console.log("Error sending data to Formspree:", error));
        }

        // Display Popup above the wrapper element
        let popupTimer;
        function showPopupWarning(wrapperId) {
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;
            
            const oldPopup = wrapper.querySelector('.popup-warning');
            if (oldPopup) oldPopup.remove();

            const popup = document.createElement('div');
            popup.className = 'popup-warning';
            popup.innerText = getRandomWarning();
            wrapper.appendChild(popup);

            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                popup.remove();
            }, 1200);
        }

        // Step 1: Show Popup Warning then transform No to Yes
        function handleNo1() {
            showPopupWarning('btn-no-1-wrapper');
            const noBtn = document.getElementById('btn-no-1');
            noBtn.innerText = 'ပြန်မလာနဲ့';
            noBtn.className = 'btn-ပြန်မလာနဲ့';
            noBtn.onclick = function() {
                nextStep(2);
            };
        }

        // Navigate between Steps & Send Formspree Notifications
        function nextStep(stepTarget) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            
            const targetElement = document.getElementById(`step-${stepTarget}`);
            if (targetElement) {
                targetElement.classList.add('active');
            }

            // Step တိုင်းတွင် အဖြေအား Formspree လင့်ခ်မှတစ်ဆင့် Gmail သို့ လှမ်းပို့ပေးခြင်း
            if (stepTarget === 2) {
                sendToFormspree("Yes", "Step 1 (12 လပိုင်းကျပြန်လာရမလား)");
            } else if (stepTarget === 3) {
                sendToFormspree("Yes", "Step 2 (တကယ် ပြန်မလာရဘူးလား… 🥺)");
            } else if (stepTarget === 'falling') {
                sendToFormspree("Yes", "Step 3 (Cora ကိုချစ်လား)");
            }

            // Step 2 မဟုတ်တော့ပါက ပြေးနေသည့် No ခလုတ်အား ဖျောက်ပေးပါမည်
            if (stepTarget !== 2) {
                const no2Wrapper = document.getElementById('btn-no-2-wrapper');
                if (no2Wrapper) {
                    no2Wrapper.style.display = 'none';
                }
            }
        }

        // Step 3.5 -> Step 4 Transition (Opens Letter with Pop-in animation)
        function openLetter() {
            sendToFormspree("Opened Letter", "Step 4 (စာလွှာဖွင့်ကြည့်လိုက်သည်)");
            nextStep(4);
        }

        // Step 2: Escape FULL SCREEN Strictly within Viewport
        let isMoving = false;
        function moveNoButton(e) {
            if (e && e.type === 'touchstart') {
                e.preventDefault();
            }

            showPopupWarning('btn-no-2-wrapper');
            
            if (isMoving) return;
            isMoving = true;

            const wrapper = document.getElementById('btn-no-2-wrapper');
            
            // Parent CSS Context Bug ကို ကျော်လွှားရန် Root Body အောက်သို့ ရွှေ့ခြင်း
            if (!wrapper.classList.contains('escaped')) {
                document.body.appendChild(wrapper);
                wrapper.classList.add('escaped');
            }

            const rect = wrapper.getBoundingClientRect();

            // Screen ဘေးပတ်လည် 20px အကွာအဝေး အတိအကျ စည်းသတ်ခြင်း
            const padding = 20;
            const maxX = Math.max(padding, window.innerWidth - rect.width - padding);
            const maxY = Math.max(padding, window.innerHeight - rect.height - padding);

            const randomX = Math.min(Math.max(padding, Math.floor(Math.random() * maxX)), maxX);
            const randomY = Math.min(Math.max(padding, Math.floor(Math.random() * maxY)), maxY);

            wrapper.style.left = `${randomX}px`;
            wrapper.style.top = `${randomY}px`;

            setTimeout(() => { isMoving = false; }, 150);
        }

        // Step 3: Shrink No, Enlarge Yes + Show Popup Window
        let yesScale = 1;
        let noScale = 1;

        function handleNo3() {
            showPopupWarning('btn-no-3-wrapper');
            
            const yesBtn = document.getElementById('btn-yes-3');
            const noBtn = document.getElementById('btn-no-3');

            yesScale += 0.35;
            noScale -= 0.2;

            yesBtn.style.transform = `scale(${yesScale})`;

            if (noScale <= 0.1) {
                noBtn.style.display = 'none';
            } else {
                noBtn.style.transform = `scale(${noScale})`;
            }
        }
    </script>
</body>
</html>
